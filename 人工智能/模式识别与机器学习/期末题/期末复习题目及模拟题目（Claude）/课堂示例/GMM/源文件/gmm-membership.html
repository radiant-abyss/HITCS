<div id="gmm-membership-example">
  <h3>一个点来自哪团？</h3>
  <div class="viz-row gmm-legend" aria-label="三个高斯成分及混合比例">
    <span><span class="gmm-dot gmm-one"></span>成分 1：混合比例 35%</span>
    <span><span class="gmm-dot gmm-two"></span>成分 2：混合比例 35%</span>
    <span><span class="gmm-dot gmm-three"></span>成分 3：混合比例 30%</span>
  </div>
  <svg class="gmm-diagram cursor-interaction" role="img" aria-label="三个二维高斯分布的等密度轮廓、中心与选中的点。点击图内可改变选中的点，也可以用下方坐标输入框。"></svg>
  <div class="viz-controls">
    <label class="form-label" for="gmm-x1">点的横坐标 x₁<input class="form-control" id="gmm-x1" type="number" step="0.1" value="0.6"></label>
    <label class="form-label" for="gmm-x2">点的纵坐标 x₂<input class="form-control" id="gmm-x2" type="number" step="0.1" value="0.4"></label>
  </div>
  <div class="gmm-probabilities" aria-live="polite">
    <div class="viz-row tabular-nums">
      <span>当前点的归属概率：</span>
      <span><span class="gmm-dot gmm-one"></span>成分 1 <span id="gmm-p1"></span></span>
      <span><span class="gmm-dot gmm-two"></span>成分 2 <span id="gmm-p2"></span></span>
      <span><span class="gmm-dot gmm-three"></span>成分 3 <span id="gmm-p3"></span></span>
    </div>
    <div class="gmm-probability-bar" role="img" aria-label="归属概率的三个部分之和为百分之百">
      <span class="gmm-one" id="gmm-bar1"></span><span class="gmm-two" id="gmm-bar2"></span><span class="gmm-three" id="gmm-bar3"></span>
    </div>
  </div>
  <style>
    #gmm-membership-example .gmm-legend { justify-content:flex-start; margin-bottom:8px; }
    #gmm-membership-example .gmm-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
    #gmm-membership-example .gmm-one { background:var(--viz-series-1); }
    #gmm-membership-example .gmm-two { background:var(--viz-series-2); }
    #gmm-membership-example .gmm-three { background:var(--viz-series-3); }
    #gmm-membership-example .gmm-diagram { display:block; width:100%; touch-action:pan-y; }
    #gmm-membership-example .gmm-diagram text { fill:var(--foreground); font-size:12px; font-weight:400; }
    #gmm-membership-example .gmm-probabilities { margin-top:12px; }
    #gmm-membership-example .gmm-probabilities .viz-row { justify-content:flex-start; }
    #gmm-membership-example .gmm-probability-bar { display:flex; height:10px; margin-top:8px; background:var(--muted); }
    #gmm-membership-example .gmm-probability-bar > span { display:block; height:100%; }
  </style>
  <script>
  (() => {
    const root=document.getElementById('gmm-membership-example');
    const svg=root.querySelector('.gmm-diagram');
    const inputs=[root.querySelector('#gmm-x1'),root.querySelector('#gmm-x2')];
    const components=[
      {mu:[-1.7,0.7],cov:[1.2,0.6,0.65],alpha:0.35},
      {mu:[1.2,1.2],cov:[0.3,0,0.3],alpha:0.35},
      {mu:[1,-1.2],cov:[0.9,-0.45,0.75],alpha:0.3}
    ];
    const ns='http://www.w3.org/2000/svg';
    let point=[0.6,0.4], scales=null;
    const saved=window.openai?.widgetState?.privateContent;
    if(saved?.example==='gmm-membership' && Array.isArray(saved.point) && saved.point.length===2 && saved.point.every(Number.isFinite)) point=saved.point;
    function probabilities(x){
      const logs=components.map(c=>{
        const [a,b,d]=c.cov,det=a*d-b*b,dx=x[0]-c.mu[0],dy=x[1]-c.mu[1];
        const q=(d*dx*dx-2*b*dx*dy+a*dy*dy)/det;
        return Math.log(c.alpha)-Math.log(2*Math.PI)-0.5*Math.log(det)-0.5*q;
      });
      const max=Math.max(...logs),weights=logs.map(v=>Math.exp(v-max)),sum=weights.reduce((a,b)=>a+b,0);
      return weights.map(v=>v/sum);
    }
    function node(tag,attrs={},content){
      const e=document.createElementNS(ns,tag);
      Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));
      if(content!==undefined)e.textContent=content;
      svg.appendChild(e);return e;
    }
    function draw(){
      const width=Math.max(300,Math.round(svg.getBoundingClientRect().width||640));
      const height=width<450?290:350;
      const bounds=components.map(c=>[c.mu[0]-2*Math.sqrt(c.cov[0]),c.mu[0]+2*Math.sqrt(c.cov[0]),c.mu[1]-2*Math.sqrt(c.cov[2]),c.mu[1]+2*Math.sqrt(c.cov[2])]);
      const xmin=Math.min(...bounds.map(v=>v[0]),point[0])-0.6,xmax=Math.max(...bounds.map(v=>v[1]),point[0])+0.6;
      const ymin=Math.min(...bounds.map(v=>v[2]),point[1])-0.5,ymax=Math.max(...bounds.map(v=>v[3]),point[1])+0.5;
      const left=64,right=width-18,top=16,bottom=height-47;
      const sx=x=>left+(x-xmin)/(xmax-xmin)*(right-left);
      const sy=y=>bottom-(y-ymin)/(ymax-ymin)*(bottom-top);
      scales={left,right,top,bottom,sx,sy,ix:v=>xmin+(v-left)/(right-left)*(xmax-xmin),iy:v=>ymin+(bottom-v)/(bottom-top)*(ymax-ymin)};
      svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);
      node('title',{},'三个高斯成分的中心与等密度轮廓');
      node('desc',{},'每个成分的两条椭圆线表示该成分内部的等密度轮廓，不是聚类分界线。叉号表示当前选中的数据点。');
      const ticks=width<450?3:4;
      for(let i=0;i<ticks;i++){
        const x=xmin+(xmax-xmin)*i/(ticks-1),y=ymin+(ymax-ymin)*i/(ticks-1);
        node('line',{x1:sx(x),x2:sx(x),y1:top,y2:bottom,stroke:'var(--border)','stroke-width':1});
        node('line',{x1:left,x2:right,y1:sy(y),y2:sy(y),stroke:'var(--border)','stroke-width':1});
        node('text',{x:sx(x),y:bottom+19,'text-anchor':i===0?'start':i===ticks-1?'end':'middle'},x.toFixed(1));
        node('text',{x:left-10,y:sy(y)+4,'text-anchor':'end'},y.toFixed(1));
      }
      node('rect',{'data-chart-frame':'',x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--border)','stroke-width':1});
      node('text',{class:'axis-title','data-axis':'x',x:(left+right)/2,y:height-5,'text-anchor':'middle'},'x₁');
      node('text',{class:'axis-title','data-axis':'y',x:18,y:(top+bottom)/2,'text-anchor':'middle',transform:`rotate(-90 18 ${(top+bottom)/2})`},'x₂');
      components.forEach((c,i)=>{
        const [a,b,d]=c.cov,l11=Math.sqrt(a),l21=b/l11,l22=Math.sqrt(d-b*b/a),color=`var(--viz-series-${i+1})`;
        for(const radius of [2,1]){
          const path=[];
          for(let k=0;k<=96;k++){
            const t=2*Math.PI*k/96,u=radius*Math.cos(t),v=radius*Math.sin(t);
            path.push(`${k?'L':'M'}${sx(c.mu[0]+l11*u).toFixed(2)},${sy(c.mu[1]+l21*u+l22*v).toFixed(2)}`);
          }
          node('path',{d:path.join(' ')+' Z',fill:radius===1?color:'none','fill-opacity':0.09,stroke:color,'stroke-width':1.4,'stroke-opacity':radius===1?0.9:0.6});
        }
        node('circle',{cx:sx(c.mu[0]),cy:sy(c.mu[1]),r:4,fill:color});
        node('text',{x:sx(c.mu[0])+10,y:sy(c.mu[1])-7},`μ${['₁','₂','₃'][i]}`);
      });
      const px=sx(point[0]),py=sy(point[1]);
      node('path',{d:`M${px-6},${py-6}L${px+6},${py+6}M${px-6},${py+6}L${px+6},${py-6}`,stroke:'var(--foreground)','stroke-width':2.5,fill:'none'});
      node('text',{x:px+10,y:py+16},'x');
      const ps=probabilities(point);
      ps.forEach((p,i)=>{
        root.querySelector(`#gmm-p${i+1}`).textContent=(100*p).toFixed(1)+'%';
        root.querySelector(`#gmm-bar${i+1}`).style.width=(100*p)+'%';
      });
    }
    function sync(save){
      inputs.forEach((input,i)=>input.value=point[i].toFixed(2));draw();
      if(save && window.openai?.setWidgetState){
        const probabilitiesNow=probabilities(point);
        window.openai.setWidgetState({modelContent:{example:'gmm-membership',point,probabilities:probabilitiesNow},privateContent:{example:'gmm-membership',point}}).catch(()=>{});
      }
    }
    inputs.forEach((input,i)=>input.addEventListener('change',()=>{
      const value=Number(input.value);
      if(input.value.trim()!=='' && Number.isFinite(value) && Math.abs(value)<=100){point[i]=value;sync(true);}else sync(false);
    }));
    svg.addEventListener('click',event=>{
      if(!scales)return;
      const rect=svg.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;
      if(x<scales.left||x>scales.right||y<scales.top||y>scales.bottom)return;
      point=[scales.ix(x),scales.iy(y)];sync(true);
    });
    window.addEventListener('openai:set_globals',event=>{
      const s=event.detail?.globals?.widgetState?.privateContent;
      if(s?.example==='gmm-membership' && Array.isArray(s.point) && s.point.length===2 && s.point.every(Number.isFinite)){point=s.point;sync(false);}
    });
    new ResizeObserver(draw).observe(svg);sync(false);
  })();
  </script>
</div>
